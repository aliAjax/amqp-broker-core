services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: broker
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - broker-postgres:/var/lib/postgresql/data
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["5672:5672", "8080:8080", "9090:9090"]
    environment:
      BROKER_NODE_ID: compose-node-1
      BROKER_DATA_DIR: /app/data
    volumes:
      - broker-data:/app/data
volumes:
  broker-postgres: {}
  broker-data: {}
