openapi: 3.1.0
info:
  title: AMQP Broker Core Management API
  version: 1.0.0
  description: Management surface for addresses, routing, deliveries, transactions, and cluster leases.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': {description: Process is alive, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': {description: Storage and runtime are ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      operationId: metrics
      responses:
        '200': {description: Prometheus exposition, content: {text/plain: {schema: {type: string}}}}
  /v1/addresses:
    get:
      operationId: listAddresses
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Address collection}
    post:
      operationId: createAddress
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAddress'}}}
      responses:
        '201': {description: Address created, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /v1/bindings:
    get:
      operationId: listBindings
      parameters:
        - {name: source, in: query, schema: {type: string}}
      responses:
        '200': {description: Binding collection}
    post:
      operationId: createBinding
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBinding'}}}
      responses:
        '201': {description: Binding created}
        '422': {$ref: '#/components/responses/Error'}
  /v1/addresses/{name}/depth:
    get:
      operationId: getAddressDepth
      parameters: [{$ref: '#/components/parameters/AddressName'}]
      responses:
        '200': {description: Current visible and acquired backlog}
        '404': {$ref: '#/components/responses/Error'}
  /v1/addresses/{name}/pause:
    post:
      operationId: pauseAddress
      parameters: [{$ref: '#/components/parameters/AddressName'}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {paused: {type: boolean}}}}}
      responses:
        '200': {description: Updated address}
        '404': {$ref: '#/components/responses/Error'}
  /v1/messages:
    post:
      operationId: publishMessage
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Publish'}}}
      responses:
        '201': {description: Routed message copies}
        '422': {$ref: '#/components/responses/Error'}
  /v1/consumers:
    post:
      operationId: createConsumer
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateConsumer'}}}
      responses:
        '201': {description: Consumer created}
  /v1/consumers/{id}/acquire:
    post:
      operationId: acquireDelivery
      parameters: [{$ref: '#/components/parameters/ConsumerID'}]
      responses:
        '200': {description: One credited delivery}
        '409': {$ref: '#/components/responses/Error'}
  /v1/consumers/{id}/settle:
    post:
      operationId: settleDelivery
      parameters: [{$ref: '#/components/parameters/ConsumerID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Settlement'}}}
      responses:
        '200': {description: Delivery settled}
        '409': {$ref: '#/components/responses/Error'}
  /v1/transactions:
    post:
      operationId: declareTransaction
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [connection_id], properties: {connection_id: {type: string}}}}}
      responses:
        '201': {description: Transaction declared}
  /v1/transactions/{id}:
    get:
      operationId: getTransaction
      parameters: [{$ref: '#/components/parameters/TransactionID'}]
      responses:
        '200': {description: Transaction state and operations}
        '404': {$ref: '#/components/responses/Error'}
  /v1/transactions/{id}/messages:
    post:
      operationId: stageTransactionalMessage
      parameters: [{$ref: '#/components/parameters/TransactionID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Publish'}}}
      responses:
        '202': {description: Message staged and invisible until commit}
        '409': {$ref: '#/components/responses/Error'}
  /v1/transactions/{id}/commit:
    post:
      operationId: commitTransaction
      parameters: [{$ref: '#/components/parameters/TransactionID'}]
      responses:
        '200': {description: Transaction committed}
        '409': {$ref: '#/components/responses/Error'}
  /v1/transactions/{id}/rollback:
    post:
      operationId: rollbackTransaction
      parameters: [{$ref: '#/components/parameters/TransactionID'}]
      responses:
        '200': {description: Transaction rolled back}
        '409': {$ref: '#/components/responses/Error'}
  /v1/dead-letters/replay:
    post:
      operationId: replayDeadLetters
      requestBody:
        content: {application/json: {schema: {type: object, properties: {limit: {type: integer, minimum: 1, maximum: 1000}}}}}
      responses:
        '200': {description: Replay count}
  /v1/connections:
    get:
      operationId: listConnections
      responses:
        '200': {description: Active AMQP connections and session counts}
  /v1/cluster/leases/{address}:
    post:
      operationId: ensureAddressLease
      parameters: [{$ref: '#/components/parameters/AddressName'}]
      responses:
        '201': {description: Current fenced shard lease}
        '409': {$ref: '#/components/responses/Error'}
  /v1/cluster/leases:
    get:
      operationId: listClusterLeases
      responses:
        '200': {description: Cluster lease collection}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    AddressName: {name: name, in: path, required: true, schema: {type: string, maxLength: 128}}
    ConsumerID: {name: id, in: path, required: true, schema: {type: string}}
    TransactionID: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Structured error response
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Health:
      type: object
      required: [status]
      properties: {status: {type: string}, node_id: {type: string}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    CreateAddress:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,127}$'}
        kind: {type: string, enum: [queue, topic, fanout, direct, temporary]}
        durable: {type: boolean}
        max_length: {type: integer, minimum: 0}
        default_ttl: {type: string, examples: [30s]}
        dead_letter: {type: string}
    Address:
      allOf:
        - {$ref: '#/components/schemas/CreateAddress'}
        - {type: object, required: [paused, created_at, version], properties: {paused: {type: boolean}, created_at: {type: string, format: date-time}, version: {type: integer}}}
    CreateBinding:
      type: object
      required: [source, destination]
      properties:
        source: {type: string}
        destination: {type: string}
        routing_key: {type: string}
        filter: {type: object, additionalProperties: {type: string}}
        priority: {type: integer, minimum: 0, maximum: 9}
    Publish:
      type: object
      required: [address, body]
      properties:
        address: {type: string}
        routing_key: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        body: {type: string}
        priority: {type: integer, minimum: 0, maximum: 9}
        ttl: {type: string}
        settled: {type: boolean}
    CreateConsumer:
      type: object
      required: [id, address]
      properties:
        id: {type: string}
        address: {type: string}
        prefetch: {type: integer, minimum: 1, maximum: 65535}
        semantics: {type: string, enum: [at-most-once, at-least-once]}
    Settlement:
      type: object
      required: [delivery_id, state]
      properties:
        delivery_id: {type: integer, minimum: 0}
        state: {type: string, enum: [accepted, released, rejected]}
